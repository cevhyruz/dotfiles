# manifest.conf
# Pinned font versions/names, sourced by install.sh.
# Bump versions here when you want to upgrade — install.sh reads these,
# it never hardcodes a version itself.

# https://github.com/ryanoasis/nerd-fonts/releases
NERD_FONT_VERSION="v3.2.1"
NERD_FONT_NAMES=(
    "FiraCode"
    "JetBrainsMono"
    "Hack"
)

# https://github.com/FortAwesome/Font-Awesome/releases
FA_VERSION="5.15.4"
FA_URL="https://github.com/FortAwesome/Font-Awesome/releases/download/${FA_VERSION}/fontawesome-free-${FA_VERSION}-web.zip"

# Install target (XDG-compliant user font dir)
FONT_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/fonts"
